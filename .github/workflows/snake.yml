name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # The FIRST colour in color_dots is the empty cell. On the dark snake it
          # must be a visible slate — a near-black empty cell vanishes against
          # GitHub's #0d1117 background and the grid looks broken.
          outputs: |
            dist/github-snake.svg?color_snake=%237C3AED&color_dots=%23E2E8F0,%23A7F3D0,%235EEAD4,%2322D3EE,%237C3AED
            dist/github-snake-dark.svg?color_snake=%23A78BFA&color_dots=%232D3343,%23065F46,%2310B981,%2322D3EE,%23A78BFA

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
